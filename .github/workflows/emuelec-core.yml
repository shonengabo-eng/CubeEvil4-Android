name: EmuELEC core (aarch64, glibc 2.28)

# Etapa 1: compila el nucleo del juego para EmuELEC S905X3 (aarch64, glibc 2.29,
# libstdc++ hasta GLIBCXX_3.4.25). Usa un sysroot de Debian buster (glibc 2.28,
# gcc-8) para que los binarios no pidan simbolos mas nuevos que los de la caja.
# Se lanza a mano: pestana Actions -> "EmuELEC core" -> Run workflow.
# v11: re4_emu es ahora el lanzador (copia de loader.c) y libre4_emu.so el frontend con el juego, la imagen (GX->GLES), el sonido y el mando.
# v10: anade el frontend re4_emu (SDL2 + GLES: ventana, mando y menu) compilado antes del nucleo.
# v9: carpeta out/ con la misma estructura que espera re4_host (modules/) + probar.sh.
# v8: el paso de reunir el resultado fallaba por un 'Permission denied' de find; ccache anadido.
# v7: los envoltorios anaden -lpthread -ldl -lm al enlazar (glibc 2.28 no los trae en libc).
# v6: enlaces absolutos del sysroot reescritos con python (libm.so estaba roto y lld usaba libm.a).
# v5: rutas del sysroot dentro de envoltorios /opt/wrap/clang(++) (el plan de enlazado
#     del proyecto llamaba a clang++ sin ellas y no encontraba crti.o, -lc, -lm...).
# v4: libgcc_s.so y libstdc++.so creados a mano (ld.lld no encontraba -lgcc_s).
# v3: desempaqueta a mano los .deb de --include (v2 los dejaba sin abrir).
# v2: sin --gcc-install-dir (clang no encontraba el GCC del sysroot); rutas
#     explicitas + diagnostico + prueba rapida antes de la compilacion larga.

on:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build python3 debootstrap binutils ccache

      - name: Sysroot Debian buster arm64
        run: |
          sudo debootstrap --foreign --no-check-gpg --variant=minbase --arch=arm64 \
            --include=libc6-dev,libgcc-8-dev,libstdc++-8-dev,linux-libc-dev \
            buster /opt/sysroot http://archive.debian.org/debian 2>&1 | tail -15
          # --foreign solo desempaqueta la base; los paquetes de --include quedan
          # descargados como .deb y hay que desempaquetarlos a mano
          for d in /opt/sysroot/var/cache/apt/archives/*.deb; do
            echo "desempaquetando $d"
            sudo dpkg-deb -x "$d" /opt/sysroot
          done
          # los enlaces absolutos (/lib/...) apuntan al sistema del runner y no al sysroot:
          # reescribirlos como relativos DENTRO del sysroot (la herramienta "symlinks" no
          # lo hace bien: deja libm.so, libdl.so... rotos y lld cae en libm.a, que no es PIC)
          sudo python3 - <<'PY'
          import os
          root = '/opt/sysroot'
          n = 0
          for dp, dn, fn in os.walk(root):
              for name in dn + fn:
                  p = os.path.join(dp, name)
                  if not os.path.islink(p):
                      continue
                  t = os.readlink(p)
                  if not os.path.isabs(t):
                      continue
                  tgt = os.path.join(root, t.lstrip('/'))
                  rel = os.path.relpath(tgt, os.path.dirname(p))
                  os.unlink(p)
                  os.symlink(rel, p)
                  n += 1
          print('enlaces absolutos reescritos:', n)
          PY
          echo "== enlaces rotos que quedan =="
          sudo find /opt/sysroot -xtype l | head -20 || true
          # enlaces de enlazado que Debian pone en libgcc-8-dev / libstdc++-8-dev y que
          # quedaron rotos: se crean a mano, relativos al sysroot
          G=/opt/sysroot/usr/lib/gcc/aarch64-linux-gnu/8
          sudo ln -sfn ../../../aarch64-linux-gnu/libgcc_s.so.1 "$G/libgcc_s.so"
          sudo ln -sfn ../../../aarch64-linux-gnu/libstdc++.so.6 "$G/libstdc++.so"
          ls -laL "$G/libgcc_s.so" "$G/libstdc++.so"
          # comprobaciones minimas: si falta algo, fallar aqui y no mas adelante
          test -e "$G/libgcc_s.so"
          test -e "$G/libstdc++.so"
          L=/opt/sysroot/usr/lib/aarch64-linux-gnu
          ls -laL "$L/libm.so" "$L/libc.so" "$L/libdl.so" "$L/libpthread.so" || true
          test -e "$L/libm.so"
          test -e "$L/libc.so"
          test -f /opt/sysroot/usr/lib/gcc/aarch64-linux-gnu/8/crtbegin.o
          test -f /opt/sysroot/usr/include/c++/8/string
          test -f /opt/sysroot/usr/include/stdio.h
          test -f /opt/sysroot/usr/lib/aarch64-linux-gnu/crt1.o

      - name: Diagnostico del sysroot
        run: |
          G=/opt/sysroot/usr/lib/gcc/aarch64-linux-gnu/8
          echo "== contenido de $G =="
          ls -la "$G" | head -40
          echo "== archivos clave =="
          find /opt/sysroot \( -name 'crtbegin*.o' -o -name 'crt1.o' -o -name 'libc.so*' \
            -o -name 'libstdc++*' -o -name 'libgcc*' -o -name 'features.h' \) | head -60
          echo "== cabeceras de C++ =="
          ls /opt/sysroot/usr/include/c++/ /opt/sysroot/usr/include/aarch64-linux-gnu/c++/ || true

      - name: Toolchain de CMake (con envoltorios de clang)
        run: |
          # El proyecto llama a veces a "clang++ --target=..." por su cuenta (plan de
          # enlazado de port/tools/whole_link_plan.py) sin pasar las rutas del sysroot.
          # Por eso las rutas van dentro de un envoltorio y no en las flags de CMake.
          sudo mkdir -p /opt/wrap
          sudo tee /opt/wrap/clang++ > /dev/null <<'EOF'
          #!/bin/bash
          S=/opt/sysroot
          G=$S/usr/lib/gcc/aarch64-linux-gnu/8
          extra=(--sysroot=$S -nostdinc++ -isystem $S/usr/include/c++/8 -isystem $S/usr/include/aarch64-linux-gnu/c++/8 -isystem $S/usr/include/c++/8/backward)
          link=1
          for a in "$@"; do
            case "$a" in -c|-E|-S) link=0 ;; esac
          done
          tail=()
          # glibc 2.28: pthread_*, dlopen y libm estan en libpthread/libdl/libm (no en libc)
          if [ $link = 1 ]; then extra+=(-fuse-ld=lld -B$G -L$G); tail=(-lpthread -ldl -lm); fi
          exec /usr/bin/clang++ "${extra[@]}" "$@" "${tail[@]}"
          EOF
          sudo tee /opt/wrap/clang > /dev/null <<'EOF'
          #!/bin/bash
          S=/opt/sysroot
          G=$S/usr/lib/gcc/aarch64-linux-gnu/8
          extra=(--sysroot=$S)
          link=1
          for a in "$@"; do
            case "$a" in -c|-E|-S) link=0 ;; esac
          done
          tail=()
          # glibc 2.28: pthread_*, dlopen y libm estan en libpthread/libdl/libm (no en libc)
          if [ $link = 1 ]; then extra+=(-fuse-ld=lld -B$G -L$G); tail=(-lpthread -ldl -lm); fi
          exec /usr/bin/clang "${extra[@]}" "$@" "${tail[@]}"
          EOF
          sudo chmod +x /opt/wrap/clang /opt/wrap/clang++
          cat > "$GITHUB_WORKSPACE/emuelec-aarch64.cmake" <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER /opt/wrap/clang)
          set(CMAKE_CXX_COMPILER /opt/wrap/clang++)
          set(CMAKE_ASM_COMPILER /opt/wrap/clang)
          set(CMAKE_C_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_CXX_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_ASM_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH /opt/sysroot)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          EOF

      - name: Prueba rapida del compilador (compila y enlaza de verdad)
        run: |
          mkdir -p smoke
          cat > smoke/t.cpp <<'EOF'
          #include <string>
          #include <vector>
          #include <cstdio>
          int f() {
            std::vector<std::string> v{"hola"};
            try { throw 1; } catch (int) { std::printf("%s\n", v[0].c_str()); }
            return 0;
          }
          EOF
          cat > smoke/m.cpp <<'EOF'
          int f();
          int main() { return f(); }
          EOF
          cat > smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(smoke C CXX)
          add_library(smk SHARED t.cpp)
          add_executable(smkexe m.cpp)
          target_link_libraries(smkexe smk)
          EOF
          cmake -S smoke -B smoke/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/emuelec-aarch64.cmake"
          cmake --build smoke/build -v
          file smoke/build/smkexe smoke/build/libsmk.so
          for f in smoke/build/smkexe smoke/build/libsmk.so; do
            readelf -Ws --dyn-syms "$f" | grep -o -E 'GLIBCXX?_[0-9.]+' | sort -uV | tail -3
          done

      - name: SDL2 de Debian buster (cabeceras y libreria para enlazar)
        run: |
          # la caja usa SDL2 2.0.9: se compila contra las cabeceras de SDL2 2.0.9 de Debian buster
          base=http://archive.debian.org/debian/pool/main/libs/libsdl2
          curl -fsSL "$base/" -o sdl_index.html
          dev=$(grep -o 'libsdl2-dev_2\.0\.9[^"<>]*_arm64\.deb' sdl_index.html | sort -u | tail -1)
          rt=$(grep -o 'libsdl2-2\.0-0_2\.0\.9[^"<>]*_arm64\.deb' sdl_index.html | sort -u | tail -1)
          echo "paquetes: [$dev] [$rt]"
          test -n "$dev"
          test -n "$rt"
          curl -fsSL -O "$base/$dev"
          curl -fsSL -O "$base/$rt"
          sudo mkdir -p /opt/sdl2dev
          sudo dpkg-deb -x "$dev" /opt/sdl2dev
          sudo dpkg-deb -x "$rt" /opt/sdl2dev
          ls -la /opt/sdl2dev/usr/lib/aarch64-linux-gnu/ | head -20
          test -f /opt/sdl2dev/usr/include/SDL2/SDL.h
          test -e /opt/sdl2dev/usr/lib/aarch64-linux-gnu/libSDL2-2.0.so.0

      - name: Cabeceras de GLES3 (Khronos), biblioteca vacia libGLESv2 y adaptador de log
        run: |
          mkdir -p emu/glhdr/GLES3 emu/glhdr/KHR emu/stubs emu/shim/android out
          base=https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/main/api
          ebase=https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api
          curl -fsSL "$base/GLES3/gl3.h" -o emu/glhdr/GLES3/gl3.h
          curl -fsSL "$base/GLES3/gl3platform.h" -o emu/glhdr/GLES3/gl3platform.h
          curl -fsSL "$base/KHR/khrplatform.h" -o emu/glhdr/KHR/khrplatform.h || curl -fsSL "$ebase/KHR/khrplatform.h" -o emu/glhdr/KHR/khrplatform.h
          ls -la emu/glhdr/GLES3 emu/glhdr/KHR
          # libGLESv2 vacia solo para que quede anotada como dependencia (las funciones salen de la libMali de la caja)
          echo 'void re4_stub_gles(void) {}' > emu/stubs/stub.c
          /opt/wrap/clang --target=aarch64-linux-gnu -shared -fPIC -o emu/stubs/libGLESv2.so.2 emu/stubs/stub.c -Wl,-soname,libGLESv2.so.2
          # el renderizador del proyecto escribe su log con <android/log.h>: aqui va a la salida de errores
          cat > emu/shim/android/log.h <<'RE4_EMU_SRC_END'
          #pragma once
          #include <cstdio>
          #define ANDROID_LOG_VERBOSE 2
          #define ANDROID_LOG_DEBUG 3
          #define ANDROID_LOG_INFO 4
          #define ANDROID_LOG_WARN 5
          #define ANDROID_LOG_ERROR 6
          #define __android_log_print(prio, tag, ...) (std::fprintf(stderr, "[%s] ", tag), std::fprintf(stderr, __VA_ARGS__), std::fprintf(stderr, "\n"), 0)
          RE4_EMU_SRC_END

