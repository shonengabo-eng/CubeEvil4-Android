name: EmuELEC core (aarch64, glibc 2.28)

# Etapa 1: compila el nucleo del juego para EmuELEC S905X3 (aarch64, glibc 2.29,
# libstdc++ hasta GLIBCXX_3.4.25). Usa un sysroot de Debian buster (glibc 2.28,
# gcc-8) para que los binarios no pidan simbolos mas nuevos que los de la caja.
# Se lanza a mano: pestana Actions -> "EmuELEC core" -> Run workflow.
# v3: desempaqueta a mano los .deb de --include (v2 los dejaba sin abrir).
# v2: sin --gcc-install-dir (clang no encontraba el GCC del sysroot); rutas
#     explicitas + diagnostico + prueba rapida antes de la compilacion larga.

on:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build python3 debootstrap binutils symlinks

      - name: Sysroot Debian buster arm64
        run: |
          sudo debootstrap --foreign --no-check-gpg --variant=minbase --arch=arm64 \
            --include=libc6-dev,libgcc-8-dev,libstdc++-8-dev,linux-libc-dev \
            buster /opt/sysroot http://archive.debian.org/debian 2>&1 | tail -15
          # --foreign solo desempaqueta la base; los paquetes de --include quedan
          # descargados como .deb y hay que desempaquetarlos a mano
          for d in /opt/sysroot/var/cache/apt/archives/*.deb; do
            echo "desempaquetando $d"
            sudo dpkg-deb -x "$d" /opt/sysroot
          done
          # los enlaces absolutos (/lib/...) apuntarian al sistema del runner: pasarlos a relativos
          sudo symlinks -cr /opt/sysroot > /dev/null
          echo "== enlaces rotos que quedan =="
          sudo find /opt/sysroot -xtype l | head -20 || true
          # comprobaciones minimas: si falta algo, fallar aqui y no mas adelante
          test -f /opt/sysroot/usr/lib/gcc/aarch64-linux-gnu/8/crtbegin.o
          test -f /opt/sysroot/usr/include/c++/8/string
          test -f /opt/sysroot/usr/include/stdio.h
          test -f /opt/sysroot/usr/lib/aarch64-linux-gnu/crt1.o

      - name: Diagnostico del sysroot
        run: |
          G=/opt/sysroot/usr/lib/gcc/aarch64-linux-gnu/8
          echo "== contenido de $G =="
          ls -la "$G" | head -40
          echo "== archivos clave =="
          find /opt/sysroot \( -name 'crtbegin*.o' -o -name 'crt1.o' -o -name 'libc.so*' \
            -o -name 'libstdc++*' -o -name 'libgcc*' -o -name 'features.h' \) | head -60
          echo "== cabeceras de C++ =="
          ls /opt/sysroot/usr/include/c++/ /opt/sysroot/usr/include/aarch64-linux-gnu/c++/ || true

      - name: Toolchain de CMake
        run: |
          cat > "$GITHUB_WORKSPACE/emuelec-aarch64.cmake" <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(RE4_SYSROOT /opt/sysroot)
          set(RE4_GCCDIR ${RE4_SYSROOT}/usr/lib/gcc/aarch64-linux-gnu/8)
          set(CMAKE_SYSROOT ${RE4_SYSROOT})
          set(CMAKE_C_COMPILER clang)
          set(CMAKE_CXX_COMPILER clang++)
          set(CMAKE_C_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_CXX_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_ASM_COMPILER_TARGET aarch64-linux-gnu)
          # libstdc++ de gcc-8 a mano (sin la deteccion de GCC de clang)
          set(CMAKE_CXX_FLAGS_INIT "-nostdinc++ -isystem ${RE4_SYSROOT}/usr/include/c++/8 -isystem ${RE4_SYSROOT}/usr/include/aarch64-linux-gnu/c++/8 -isystem ${RE4_SYSROOT}/usr/include/c++/8/backward")
          set(RE4_LINK "-fuse-ld=lld -B${RE4_GCCDIR} -L${RE4_GCCDIR}")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "${RE4_LINK}")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "${RE4_LINK}")
          set(CMAKE_MODULE_LINKER_FLAGS_INIT "${RE4_LINK}")
          set(CMAKE_FIND_ROOT_PATH ${RE4_SYSROOT})
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          EOF

      - name: Prueba rapida del compilador (compila y enlaza de verdad)
        run: |
          mkdir -p smoke
          cat > smoke/t.cpp <<'EOF'
          #include <string>
          #include <vector>
          #include <cstdio>
          int f() {
            std::vector<std::string> v{"hola"};
            try { throw 1; } catch (int) { std::printf("%s\n", v[0].c_str()); }
            return 0;
          }
          EOF
          cat > smoke/m.cpp <<'EOF'
          int f();
          int main() { return f(); }
          EOF
          cat > smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(smoke C CXX)
          add_library(smk SHARED t.cpp)
          add_executable(smkexe m.cpp)
          target_link_libraries(smkexe smk)
          EOF
          cmake -S smoke -B smoke/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/emuelec-aarch64.cmake"
          cmake --build smoke/build -v
          file smoke/build/smkexe smoke/build/libsmk.so
          for f in smoke/build/smkexe smoke/build/libsmk.so; do
            readelf -Ws --dyn-syms "$f" | grep -o -E 'GLIBCXX?_[0-9.]+' | sort -uV | tail -3
          done

      - name: Configurar
        run: |
          set -o pipefail
          cmake -S port/whole -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/emuelec-aarch64.cmake" \
            -DRE4_OPT_LEVEL=2 2>&1 | tee configure.log

      - name: Compilar
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      - name: Reunir resultado
        run: |
          mkdir -p out
          find build -type f \( -name 'libre4_*.so*' -o -name 're4_host' \) -exec cp -v {} out/ \;
          find /opt/sysroot -name 'libstdc++.so.6*' -exec cp -av {} out/ \;
          find /opt/sysroot -name 'libgcc_s.so.1' -exec cp -av {} out/ \;
          ls -la out | head -200

      - name: Comprobar versiones de glibc y libstdc++
        run: |
          cd out
          echo "== GLIBC maximo pedido (la caja tiene 2.29) =="
          for f in *.so* re4_host; do
            [ -f "$f" ] && readelf -Ws --dyn-syms "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' ; done | sort -uV | tail -3
          echo "== GLIBCXX maximo pedido (la caja llega a 3.4.25) =="
          for f in *.so* re4_host; do
            [ -f "$f" ] && readelf -Ws --dyn-syms "$f" 2>/dev/null | grep -o 'GLIBCXX_[0-9.]*' ; done | sort -uV | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: emuelec-core-aarch64
          path: out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore
