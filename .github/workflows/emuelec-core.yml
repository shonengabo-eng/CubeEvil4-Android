name: EmuELEC core (aarch64, glibc 2.28)

# Etapa 1: compila el nucleo del juego para EmuELEC S905X3 (aarch64, glibc 2.29,
# libstdc++ hasta GLIBCXX_3.4.25). Usa un sysroot de Debian buster (glibc 2.28,
# gcc-8) para que los binarios no pidan simbolos mas nuevos que los de la caja.
# Se lanza a mano: pestana Actions -> "EmuELEC core" -> Run workflow.

on:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build python3 debootstrap binutils

      - name: Sysroot Debian buster arm64
        run: |
          sudo debootstrap --foreign --no-check-gpg --variant=minbase --arch=arm64 \
            --include=libc6-dev,libgcc-8-dev,libstdc++-8-dev,linux-libc-dev \
            buster /opt/sysroot http://archive.debian.org/debian
          ls /opt/sysroot/usr/lib/gcc/aarch64-linux-gnu/
          ls /opt/sysroot/usr/lib/aarch64-linux-gnu | head -30

      - name: Toolchain de CMake
        run: |
          cat > "$GITHUB_WORKSPACE/emuelec-aarch64.cmake" <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(RE4_SYSROOT /opt/sysroot)
          set(CMAKE_SYSROOT ${RE4_SYSROOT})
          set(CMAKE_C_COMPILER clang)
          set(CMAKE_CXX_COMPILER clang++)
          set(CMAKE_C_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_CXX_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_ASM_COMPILER_TARGET aarch64-linux-gnu)
          set(RE4_GCCDIR ${RE4_SYSROOT}/usr/lib/gcc/aarch64-linux-gnu/8)
          set(CMAKE_C_FLAGS_INIT "--gcc-install-dir=${RE4_GCCDIR}")
          set(CMAKE_CXX_FLAGS_INIT "--gcc-install-dir=${RE4_GCCDIR}")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-fuse-ld=lld")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "-fuse-ld=lld")
          set(CMAKE_MODULE_LINKER_FLAGS_INIT "-fuse-ld=lld")
          set(CMAKE_FIND_ROOT_PATH ${RE4_SYSROOT})
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          EOF

      - name: Configurar
        run: |
          set -o pipefail
          cmake -S port/whole -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/emuelec-aarch64.cmake" \
            -DRE4_OPT_LEVEL=2 2>&1 | tee configure.log

      - name: Compilar
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      - name: Reunir resultado
        run: |
          mkdir -p out
          find build -type f \( -name 'libre4_*.so*' -o -name 're4_host' \) -exec cp -v {} out/ \;
          find /opt/sysroot -name 'libstdc++.so.6*' -exec cp -av {} out/ \;
          find /opt/sysroot -name 'libgcc_s.so.1' -exec cp -av {} out/ \;
          ls -la out | head -200

      - name: Comprobar versiones de glibc y libstdc++
        run: |
          cd out
          echo "== GLIBC maximo pedido (la caja tiene 2.29) =="
          for f in *.so* re4_host; do
            [ -f "$f" ] && readelf -Ws --dyn-syms "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' ; done | sort -uV | tail -3
          echo "== GLIBCXX maximo pedido (la caja llega a 3.4.25) =="
          for f in *.so* re4_host; do
            [ -f "$f" ] && readelf -Ws --dyn-syms "$f" 2>/dev/null | grep -o 'GLIBCXX_[0-9.]*' ; done | sort -uV | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: emuelec-core-aarch64
          path: out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore
