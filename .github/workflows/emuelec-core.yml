          // ---------------------------------------------------------------------------------------------
          // Importador de discos GameCube (.gcm / .iso): extrae los archivos al formato de carpeta que lee el nucleo
          // (el mismo que "Extract Entire Disc" de Dolphin y port/tools/whole_disc_folder.py):
          //     data/disc0/sys/{boot.bin,bi2.bin,apploader.img,main.dol,fst.bin}   data/disc0/files/...   (disco 1)
          //     data/disc1/...                                                                                (disco 2)
          // ---------------------------------------------------------------------------------------------
          static uint32_t be32(const uint8_t *p) { return ((uint32_t)p[0] << 24) | ((uint32_t)p[1] << 16) | ((uint32_t)p[2] << 8) | p[3]; }

          struct DiscImage {
              std::string path, file, id;
              int number = -1;
              uint64_t size = 0;
              uint8_t hdr[0x440];
              uint32_t dolOff = 0, fstOff = 0, fstSize = 0;
          };

          struct Ent { bool dir; std::string path; uint32_t off, size; };

          static bool readAt(FILE *f, uint64_t off, void *buf, size_t n)
          {
              if (n == 0) return true;
              if (fseeko(f, (off_t)off, SEEK_SET) != 0) return false;
              return std::fread(buf, 1, n, f) == n;
          }

          static std::string humanSize(uint64_t b)
          {
              char buf[48];
              if (b >= (1ull << 30)) std::snprintf(buf, sizeof(buf), "%.2f GB", b / 1073741824.0);
              else std::snprintf(buf, sizeof(buf), "%.1f MB", b / 1048576.0);
              return buf;
          }

          static std::string releaseName(const std::string &id)
          {
              if (id == "G4BE08") return "prototipo debug o edición USA";
              if (id == "G4BP08") return "edición europea";
              if (id == "G4BJ08") return "edición japonesa";
              return "edición no compatible";
          }

          static bool supportedId(const std::string &id) { return id == "G4BE08" || id == "G4BP08" || id == "G4BJ08"; }

          static bool probeDisc(const std::string &path, DiscImage &d, std::string &err)
          {
              d.path = path;
              size_t sl = path.find_last_of('/');
              d.file = sl == std::string::npos ? path : path.substr(sl + 1);
              FILE *f = std::fopen(path.c_str(), "rb");
              if (!f) { err = "no se puede abrir: " + std::string(std::strerror(errno)); return false; }
              fseeko(f, 0, SEEK_END);
              d.size = (uint64_t)ftello(f);
              bool ok = readAt(f, 0, d.hdr, sizeof(d.hdr));
              std::fclose(f);
              if (!ok) { err = "archivo demasiado corto"; return false; }
              static const uint8_t magic[4] = {0xC2, 0x33, 0x9F, 0x3D};
              if (std::memcmp(d.hdr + 0x1C, magic, 4) != 0) { err = "no es un disco de GameCube (.gcm/.iso)"; return false; }
              d.id.assign((const char *)d.hdr, 6);
              for (char c : d.id) if (c < 0x20 || c > 0x7E) { err = "identificador de disco no valido"; return false; }
              d.number = d.hdr[6];
              d.dolOff = be32(d.hdr + 0x420);
              d.fstOff = be32(d.hdr + 0x424);
              d.fstSize = be32(d.hdr + 0x428);
              if (d.fstSize < 12 || d.fstSize > 64u * 1024 * 1024) { err = "tabla de archivos (FST) fuera de limites"; return false; }
              if ((uint64_t)d.fstOff + d.fstSize > d.size || (uint64_t)d.dolOff + 0x100 > d.size) { err = "disco recortado o danado"; return false; }
              return true;
          }

          static bool parseFst(const std::vector<uint8_t> &d, uint64_t imgSize, std::vector<Ent> &out, std::string &err)
          {
              if (d.size() < 12) { err = "FST vacio"; return false; }
              uint32_t flags = be32(d.data()), parent = be32(d.data() + 4), count = be32(d.data() + 8);
              if (flags != 0x01000000 || parent != 0 || count < 1 || count > d.size() / 12) { err = "FST: raiz o cantidad no validas"; return false; }
              const uint8_t *names = d.data() + 12 * (size_t)count;
              size_t namesLen = d.size() - 12 * (size_t)count;
              struct Lvl { std::string path; uint32_t end, idx; };
              std::vector<Lvl> stack;
              stack.push_back({"", count, 0});
              std::set<std::string> seen;
              for (uint32_t i = 1; i < count; i++) {
                  while (i >= stack.back().end) {
                      stack.pop_back();
                      if (stack.empty()) { err = "FST: jerarquia no valida"; return false; }
                  }
                  const uint8_t *e = d.data() + 12 * (size_t)i;
                  uint32_t fn = be32(e), a = be32(e + 4), b = be32(e + 8);
                  uint32_t flag = fn >> 24, nameOff = fn & 0xFFFFFF;
                  if (flag > 1 || nameOff >= namesLen) { err = "FST: tipo o nombre no validos"; return false; }
                  size_t end = nameOff;
                  while (end < namesLen && names[end] != 0) end++;
                  if (end >= namesLen) { err = "FST: nombre sin terminar"; return false; }
                  std::string name((const char *)names + nameOff, end - nameOff);
                  if (name.empty() || name == "." || name == ".." || name.find_first_of("/\\:") != std::string::npos) { err = "FST: nombre inseguro"; return false; }
                  std::string path = stack.back().path + (stack.back().path.empty() ? "" : "/") + name;
                  std::string low = path;
                  for (char &c : low) if (c >= 'A' && c <= 'Z') c = (char)(c + 32);
                  if (!seen.insert(low).second) { err = "FST: ruta ambigua (mayusculas/minusculas): " + path; return false; }
                  if (flag) {
                      if (a != stack.back().idx || !(i < b && b <= stack.back().end)) { err = "FST: rango de carpeta no valido"; return false; }
                      stack.push_back({path, b, i});
                      out.push_back({true, path, 0, 0});
                  } else {
                      if ((uint64_t)a > imgSize || (uint64_t)b > imgSize - a) { err = "FST: archivo fuera del disco: " + path; return false; }
                      out.push_back({false, path, a, b});
                  }
              }
              return true;
          }

          static bool mkdirs(const std::string &path)
          {
              for (size_t i = 1; i <= path.size(); i++)
                  if (i == path.size() || path[i] == '/') {
                      std::string p = path.substr(0, i);
                      if (mkdir(p.c_str(), 0777) != 0 && errno != EEXIST) return false;
                  }
              return true;
          }

          struct ImportJob {
              std::atomic<uint64_t> done{0}, total{0};
              std::atomic<int> state{0};     // 0 sin empezar, 1 en curso, 2 terminado, 3 error, 4 cancelado
              std::atomic<int> discNo{0};
              std::atomic<bool> cancel{false};
              std::string current, error;    // (se leen solo cuando state != 1, o con cuidado: es solo texto de ayuda)
              std::atomic<int> filesDone{0}, filesTotal{0};
              char cur[160] = {0};
          };

          static bool copySpan(FILE *src, uint64_t off, uint64_t size, const std::string &dst, ImportJob &job, std::string &err)
          {
              std::string tmp = dst + ".part";
              FILE *o = std::fopen(tmp.c_str(), "wb");
              if (!o) { err = "no puedo crear " + dst + ": " + std::strerror(errno); return false; }
              std::vector<uint8_t> buf(1 << 20);
              uint64_t left = size, pos = off;
              while (left) {
                  if (job.cancel) { std::fclose(o); std::remove(tmp.c_str()); err = "cancelado"; return false; }
                  size_t n = (size_t)std::min<uint64_t>(left, buf.size());
                  if (!readAt(src, pos, buf.data(), n)) { std::fclose(o); std::remove(tmp.c_str()); err = "lectura corta del disco en " + dst; return false; }
                  if (std::fwrite(buf.data(), 1, n, o) != n) { std::fclose(o); std::remove(tmp.c_str()); err = "no se pudo escribir (¿sin espacio?): " + dst; return false; }
                  pos += n; left -= n; job.done += n;
              }
              if (std::fclose(o) != 0) { std::remove(tmp.c_str()); err = "error al cerrar " + dst; return false; }
              if (std::rename(tmp.c_str(), dst.c_str()) != 0) { err = "no pude renombrar " + dst; return false; }
              return true;
          }

          static bool writeBytes(const std::string &dst, const uint8_t *data, size_t n, std::string &err)
          {
              FILE *o = std::fopen(dst.c_str(), "wb");
              if (!o || std::fwrite(data, 1, n, o) != n) { if (o) std::fclose(o); err = "no se pudo escribir " + dst; return false; }
              std::fclose(o);
              return true;
          }

          struct Plan {
              DiscImage disc;
              std::vector<uint8_t> fst;
              std::vector<Ent> ents;
              uint32_t dolSize = 0, apploaderSize = 0;
              uint64_t bytes = 0;
          };

          // Lee y valida (sin escribir nada) la cabecera, el DOL, el apploader y la FST de un disco
          static bool planDisc(const DiscImage &d, Plan &p, std::string &err)
          {
              p.disc = d;
              FILE *f = std::fopen(d.path.c_str(), "rb");
              if (!f) { err = "no se puede abrir " + d.file; return false; }
              bool ok = false;
              do {
                  p.fst.resize(d.fstSize);
                  if (!readAt(f, d.fstOff, p.fst.data(), d.fstSize)) { err = "no pude leer la FST"; break; }
                  if (!parseFst(p.fst, d.size, p.ents, err)) break;
                  uint8_t dh[0x100];
                  if (!readAt(f, d.dolOff, dh, sizeof(dh))) { err = "no pude leer el DOL"; break; }
                  uint64_t dolSize = 0x100;
                  bool bad = false;
                  for (int i = 0; i < 18; i++) {
                      uint32_t off = be32(dh + i * 4), sz = be32(dh + 0x90 + i * 4);
                      if (sz && off < 0x100) { bad = true; break; }
                      if ((uint64_t)d.dolOff + off > d.size || (uint64_t)sz > d.size - (d.dolOff + (uint64_t)off)) { bad = true; break; }
                      dolSize = std::max<uint64_t>(dolSize, (uint64_t)off + sz);
                  }
                  if (bad) { err = "DOL no valido"; break; }
                  p.dolSize = (uint32_t)dolSize;
                  uint8_t ah[32];
                  if (!readAt(f, 0x2440, ah, sizeof(ah))) { err = "no pude leer el apploader"; break; }
                  uint64_t asz = 32 + (uint64_t)be32(ah + 20) + be32(ah + 24);
                  if (0x2440 + asz > d.size || asz > 16u * 1024 * 1024) { err = "apploader no valido"; break; }
                  p.apploaderSize = (uint32_t)asz;
                  p.bytes = sizeof(d.hdr) + 0x2000 + p.apploaderSize + p.dolSize + p.fst.size();
                  for (const Ent &e : p.ents) if (!e.dir) p.bytes += e.size;
                  ok = true;
              } while (0);
              std::fclose(f);
              return ok;
          }

          static bool importDisc(const Plan &p, const std::string &outDir, ImportJob &job, std::string &err)
          {
              const DiscImage &d = p.disc;
              std::string base = outDir + "/disc" + std::to_string(d.number);
              std::string sysd = base + "/sys", files = base + "/files";
              if (!mkdirs(sysd) || !mkdirs(files)) { err = "no puedo crear " + base + ": " + std::strerror(errno); return false; }
              FILE *f = std::fopen(d.path.c_str(), "rb");
              if (!f) { err = "no se puede abrir " + d.file; return false; }
              bool ok = false;
              do {
                  std::vector<uint8_t> tmp;
                  auto sysFile = [&](const char *name, uint64_t off, size_t n) {
                      tmp.resize(n);
                      if (!readAt(f, off, tmp.data(), n)) { err = std::string("lectura corta: ") + name; return false; }
                      if (!writeBytes(sysd + "/" + name, tmp.data(), n, err)) return false;
                      job.done += n;
                      return true;
                  };
                  std::snprintf(job.cur, sizeof(job.cur), "sys/");
                  if (!sysFile("boot.bin", 0, 0x440) || !sysFile("bi2.bin", 0x440, 0x2000) || !sysFile("apploader.img", 0x2440, p.apploaderSize) ||
                      !sysFile("main.dol", d.dolOff, p.dolSize))
                      break;
                  if (!writeBytes(sysd + "/fst.bin", p.fst.data(), p.fst.size(), err)) break;
                  job.done += p.fst.size();
                  bool fail = false;
                  for (const Ent &e : p.ents) {
                      if (e.dir) {
                          if (!mkdirs(files + "/" + e.path)) { err = "no puedo crear la carpeta " + e.path; fail = true; break; }
                          continue;
                      }
                      std::snprintf(job.cur, sizeof(job.cur), "%s", e.path.c_str());
                      if (!copySpan(f, e.off, e.size, files + "/" + e.path, job, err)) { fail = true; break; }
                      job.filesDone++;
                  }
                  if (fail) break;
                  ok = true;
              } while (0);
              std::fclose(f);
              return ok;
          }

          static void importThread(std::vector<Plan> *plans, std::string outDir, ImportJob *job)
          {
              job->state = 1;
              std::string err;
              for (const Plan &p : *plans) {
                  job->discNo = p.disc.number + 1;
                  if (!importDisc(p, outDir, *job, err)) {
                      job->error = err;
                      job->state = job->cancel ? 4 : 3;
                      return;
                  }
              }
              // marca de importacion terminada
              std::string marker;
              for (const Plan &p : *plans)
                  marker += "disc" + std::to_string(p.disc.number) + "=" + p.disc.file + " " + p.disc.id + " " + std::to_string(p.disc.size) + "\n";
              if (!writeBytes(outDir + "/import.ok", (const uint8_t *)marker.data(), marker.size(), err)) { job->error = err; job->state = 3; return; }
              job->state = 2;
          }

          static bool fileExists(const std::string &p)
          {
              struct stat st;
              return stat(p.c_str(), &st) == 0;
          }

          static std::string lowerExt(const std::string &n)
          {
              size_t dot = n.find_last_of('.');
              if (dot == std::string::npos) return "";
              std::string e = n.substr(dot);
              for (char &c : e) if (c >= 'A' && c <= 'Z') c = (char)(c + 32);
              return e;
          }


          // ---------------------------------------------------------------------------------------------
          // Juego: nucleo (libre4_main.so), renderizador GX -> GLES, audio y mando
          // ---------------------------------------------------------------------------------------------
          struct CoreApi {
              void *lib = nullptr;
              decltype(&re4_core_reserve) reserve = nullptr;
              decltype(&re4_core_start) start = nullptr;
              decltype(&re4_core_state) state = nullptr;
              decltype(&re4_core_message) message = nullptr;
              decltype(&re4_core_pad) pad = nullptr;
              decltype(&re4_core_audio) audio = nullptr;
              decltype(&re4_core_gx_acquire) gxAcquire = nullptr;
              decltype(&re4_core_gx_release) gxRelease = nullptr;
              decltype(&re4_core_vsync) vsync = nullptr;
              decltype(&re4_core_pause) pause = nullptr;
              decltype(&re4_core_set_potato) setPotato = nullptr;
              decltype(&re4_core_set_view_distance) setViewDistance = nullptr;
              decltype(&re4_core_set_dof) setDof = nullptr;
              decltype(&re4_core_set_cpu_skip) setCpuSkip = nullptr;
              decltype(&re4_core_debug_menu) debugMenu = nullptr;
              decltype(&re4_core_disc_problem) discProblem = nullptr;
          };
          static CoreApi gApi;
          static std::unique_ptr<re4gx::GxRenderer> gGx;
          static SDL_AudioDeviceID gAudio = 0;

          template <class F>
          static bool bindSym(F &slot, const char *name, std::string &err, bool required)
          {
              slot = reinterpret_cast<F>(dlsym(gApi.lib, name));
              if (!slot && required) { err = std::string("falta ") + name + " en libre4_main.so"; return false; }
              return true;
          }

          static std::string exeDir()
          {
              char buf[PATH_MAX];
              ssize_t n = readlink("/proc/self/exe", buf, sizeof(buf) - 1);
              if (n <= 0) return ".";
              buf[n] = 0;
              return dirname(buf);
          }

          static bool loadCore(std::string &err)
          {
              if (gApi.lib) return true;
              std::string path = exeDir() + "/libre4_main.so";
              // dibujos fusionados (menos llamadas a la GPU por cuadro, experimental): activo salvo que exista el archivo "sin_fusion" junto al programa
              if (access((exeDir() + "/sin_fusion").c_str(), F_OK) != 0) setenv("RE4_GX_MERGE", "1", 0);
              setenv("RE4_GX_THREADS", "2", 0);  // hilos de vertices: 2 (por defecto 1 con 4 nucleos); el lanzador puede cambiarlo
              gApi.lib = dlopen(path.c_str(), RTLD_NOW | RTLD_LOCAL);
              if (!gApi.lib) { err = std::string("no pude cargar libre4_main.so: ") + dlerror(); return false; }
              return bindSym(gApi.reserve, "re4_core_reserve", err, true) && bindSym(gApi.start, "re4_core_start", err, true) &&
                     bindSym(gApi.state, "re4_core_state", err, true) && bindSym(gApi.message, "re4_core_message", err, true) &&
                     bindSym(gApi.pad, "re4_core_pad", err, true) && bindSym(gApi.audio, "re4_core_audio", err, true) &&
                     bindSym(gApi.gxAcquire, "re4_core_gx_acquire", err, true) && bindSym(gApi.gxRelease, "re4_core_gx_release", err, true) &&
                     bindSym(gApi.vsync, "re4_core_vsync", err, false) && bindSym(gApi.pause, "re4_core_pause", err, false) &&
                     bindSym(gApi.setPotato, "re4_core_set_potato", err, false) &&
                     bindSym(gApi.setViewDistance, "re4_core_set_view_distance", err, false) &&
                     bindSym(gApi.setCpuSkip, "re4_core_set_cpu_skip", err, false) &&
                     bindSym(gApi.setDof, "re4_core_set_dof", err, false) && bindSym(gApi.debugMenu, "re4_core_debug_menu", err, false) &&
                     bindSym(gApi.discProblem, "re4_core_disc_problem", err, false);
          }

          // calidad -> mascara "potato" del nucleo: bit 0 sin clima, bit 1 sin efectos especiales,
          // bits 2-3 particulas (1 menos, 2 ninguna), bit 4 sin sombras ni efectos de luz
          static int potatoMask(int quality)
          {
              static const int m[4] = {0, 1 | (1 << 2), 1 | 2 | (1 << 2) | 16, 1 | 2 | (2 << 2) | 16};
              return m[std::clamp(quality, 0, 3)];
          }

          static void applyCore()
          {
              if (gApi.setPotato) gApi.setPotato(potatoMask(gCfg.quality));
              if (gApi.setViewDistance) gApi.setViewDistance(50 + gCfg.dist * 10);
              if (gApi.setDof) gApi.setDof(gCfg.dof);
              if (gApi.setCpuSkip) gApi.setCpuSkip(1);  // salto de imagenes agresivo: la logica sigue, se dibuja menos
              if (gGx) {
                  gGx->SetFxaa(gCfg.fxaa != 0);
                  gGx->RescaleHalves(2 + gCfg.scale);
              }
          }

          static void audioCb(void *, Uint8 *stream, int len)
          {
              int frames = len / 4;
              int got = gApi.audio ? gApi.audio((int16_t *)stream, frames) : 0;
              if (got < 0) got = 0;
              if (got < frames) std::memset(stream + (size_t)got * 4, 0, (size_t)(frames - got) * 4);
          }

          static void openAudio()
          {
              SDL_AudioSpec want;
              std::memset(&want, 0, sizeof(want));
              want.freq = 32000;
              want.format = AUDIO_S16SYS;
              want.channels = 2;
              want.samples = 2048;  // el doble de colchon: menos cortes de sonido cuando una vuelta del bucle se alarga
              want.callback = audioCb;
              gAudio = SDL_OpenAudioDevice(nullptr, 0, &want, nullptr, 0);  // sin "obtained": SDL convierte al formato del equipo
              if (!gAudio) { std::printf("[audio] no pude abrir el audio: %s (el juego sigue sin sonido)\n", SDL_GetError()); return; }
              SDL_PauseAudioDevice(gAudio, 0);
              std::printf("[audio] abierto: 32000 Hz estereo, %d muestras (driver %s)\n", want.samples, SDL_GetCurrentAudioDriver() ? SDL_GetCurrentAudioDriver() : "?");
          }

          static bool startGame(std::string &err)
          {
              if (!loadCore(err)) return false;
              char cwd[PATH_MAX];
              if (!getcwd(cwd, sizeof(cwd))) { err = "no pude leer la carpeta actual"; return false; }
              std::string dataDir = std::string(cwd) + "/data", moduleDir = exeDir() + "/modules";
              std::printf("[juego] reservando memoria; datos=%s modulos=%s\n", dataDir.c_str(), moduleDir.c_str());
              if (!gApi.reserve(dataDir.c_str(), moduleDir.c_str())) {
                  const char *m = gApi.message ? gApi.message() : nullptr;
                  err = std::string("reserva de memoria: ") + (m ? m : "sin detalle");
                  return false;
              }
              applyCore();
              if (!gApi.start()) {
                  const char *m = gApi.message ? gApi.message() : nullptr;
                  err = std::string("arranque del nucleo: ") + (m ? m : "sin detalle");
                  return false;
              }
              std::printf("[juego] nucleo en marcha (estado %d)\n", gApi.state());
              openAudio();
              return true;
          }

          static bool initGx(std::string &err)
          {
              gGx = std::make_unique<re4gx::GxRenderer>(re4gx::GxApi::kGl);
              re4gx::GxOptions o;
              gGx->SetOptions(o);
              const char *cache = std::getenv("RE4_GX_PROGRAM_CACHE");
              if (cache && *cache) {
                  mkdir(cache, 0777);
                  gGx->SetProgramCache(cache);
              }
              if (!gGx->InitHalves(2 + gCfg.scale, &err)) { gGx.reset(); return false; }
              gGx->SetFxaa(gCfg.fxaa != 0);
              std::printf("[gx] renderizador listo (escala interna %.1fx)\n", (2 + gCfg.scale) / 2.0);
              return true;
          }

          // muestra la ultima imagen que dejo el juego en la pantalla (16:9 como la app, o 4:3 original)
          static bool drawPicture(int gw, int gh)
          {
              unsigned xw = 0, xh = 0;
              if (!gGx || !gGx->Xfb(&xw, &xh)) return false;
              if (gCfg.aspect == 0) {
                  int bw = gw, bh = gw * 9 / 16;
                  if (bh > gh) { bh = gh; bw = gh * 16 / 9; }
                  gGx->Present((gw - bw) / 2, (gh - bh) / 2, bw, bh, xh * 56 / 448, xh * 336 / 448);
              } else {
                  int bw = gw, bh = gw * 3 / 4;
                  if (bh > gh) { bh = gh; bw = gh * 4 / 3; }
                  gGx->Present((gw - bw) / 2, (gh - bh) / 2, bw, bh);
              }
              return true;
          }

          static int8_t clampS8(int v, int lim) { return (int8_t)std::max(-lim, std::min(lim, v)); }

          // botones de SDL -> mando de GameCube (A/B/X/Y como estan, Z = R1, L/R = gatillos L2/R2, palanca C = palanca derecha)
          static Re4CorePad makePad(bool neutral, bool maskStart)
          {
              Re4CorePad p;
              std::memset(&p, 0, sizeof(p));
              if (neutral) return p;
              unsigned b = 0;
              if (padButton(SDL_CONTROLLER_BUTTON_DPAD_LEFT)) b |= 0x0001;
              if (padButton(SDL_CONTROLLER_BUTTON_DPAD_RIGHT)) b |= 0x0002;
              if (padButton(SDL_CONTROLLER_BUTTON_DPAD_DOWN)) b |= 0x0004;
              if (padButton(SDL_CONTROLLER_BUTTON_DPAD_UP)) b |= 0x0008;
              if (padButton(SDL_CONTROLLER_BUTTON_RIGHTSHOULDER)) b |= 0x0010;  // Z
              if (padButton(SDL_CONTROLLER_BUTTON_A)) b |= 0x0100;
              if (padButton(SDL_CONTROLLER_BUTTON_B)) b |= 0x0200;
              if (padButton(SDL_CONTROLLER_BUTTON_X)) b |= 0x0400;
              if (padButton(SDL_CONTROLLER_BUTTON_Y)) b |= 0x0800;
              if (padButton(SDL_CONTROLLER_BUTTON_START) && !maskStart) b |= 0x1000;
              int tl = std::max(0, padAxis(SDL_CONTROLLER_AXIS_TRIGGERLEFT)) >> 7;
              int tr = std::max(0, padAxis(SDL_CONTROLLER_AXIS_TRIGGERRIGHT)) >> 7;
              if (padButton(SDL_CONTROLLER_BUTTON_LEFTSHOULDER)) tl = 255;
              if (tl > 150) b |= 0x0040;  // L
              if (tr > 150) b |= 0x0020;  // R
              p.buttons = (uint16_t)b;
              p.triggerL = (uint8_t)std::min(255, tl);
              p.triggerR = (uint8_t)std::min(255, tr);
              p.stickX = clampS8(padAxis(SDL_CONTROLLER_AXIS_LEFTX) * 100 / 32767, 100);
              p.stickY = clampS8(-padAxis(SDL_CONTROLLER_AXIS_LEFTY) * 100 / 32767, 100);
              p.substickX = clampS8(padAxis(SDL_CONTROLLER_AXIS_RIGHTX) * 90 / 32767, 90);
              p.substickY = clampS8(-padAxis(SDL_CONTROLLER_AXIS_RIGHTY) * 90 / 32767, 90);
              return p;
          }

          // Busca los discos en assets/ y los valida (no escribe nada)
          static void scanAssets(std::vector<Plan> &plans, std::vector<std::string> &msgs)
          {
              plans.clear();
              msgs.clear();
              std::vector<std::string> cands, rvz;
              DIR *dir = opendir("assets");
              if (!dir) { msgs.push_back("No existe la carpeta assets/ (pon aquí tus dos discos .gcm o .iso)"); return; }
              while (dirent *e = readdir(dir)) {
                  std::string n = e->d_name, x = lowerExt(n);
                  if (x == ".gcm" || x == ".iso") cands.push_back("assets/" + n);
                  else if (x == ".rvz") rvz.push_back(n);
              }
              closedir(dir);
              std::sort(cands.begin(), cands.end());
              Plan byNum[2];
              bool have[2] = {false, false};
              for (const std::string &c : cands) {
                  DiscImage d;
                  std::string err;
                  if (!probeDisc(c, d, err)) { msgs.push_back(d.file + ": " + err); continue; }
                  if (!supportedId(d.id)) { msgs.push_back(d.file + ": " + d.id + " no es una edición compatible"); continue; }
                  if (d.number < 0 || d.number > 1) { msgs.push_back(d.file + ": número de disco no válido"); continue; }
                  if (have[d.number]) { msgs.push_back(d.file + ": ya hay otro archivo del disco " + std::to_string(d.number + 1)); continue; }
                  Plan pl;
                  if (!planDisc(d, pl, err)) { msgs.push_back(d.file + ": " + err); continue; }
                  byNum[d.number] = pl;
                  have[d.number] = true;
              }
              if (!rvz.empty()) msgs.push_back("Hay archivos .rvz: todavía no se pueden leer (próxima etapa); usa .gcm o .iso por ahora");
              if (have[0] && have[1]) {
                  if (byNum[0].disc.id != byNum[1].disc.id) msgs.push_back("Los dos discos son de ediciones distintas");
                  else { plans.push_back(byNum[0]); plans.push_back(byNum[1]); }
              } else {
                  if (!have[0]) msgs.push_back("Falta el disco 1 (.gcm o .iso) en assets/");
                  if (!have[1]) msgs.push_back("Falta el disco 2 (.gcm o .iso) en assets/");
              }
          }

          // Modo sin ventana:  re4_emu --import <carpeta_salida> <disco1> <disco2>   (para pruebas y diagnostico)
          static int cliImport(const char *out, int n, char **imgs)
          {
              std::vector<Plan> plans;
              for (int i = 0; i < n; i++) {
                  DiscImage d;
                  std::string err;
                  Plan p;
                  if (!probeDisc(imgs[i], d, err) || !planDisc(d, p, err)) { std::printf("ERROR %s: %s\n", imgs[i], err.c_str()); return 1; }
                  std::printf("%s: %s disco %d, %zu entradas, %s\n", d.file.c_str(), d.id.c_str(), d.number + 1, p.ents.size(), humanSize(p.bytes).c_str());
                  plans.push_back(p);
              }
              std::sort(plans.begin(), plans.end(), [](const Plan &a, const Plan &b) { return a.disc.number < b.disc.number; });
              ImportJob job;
              for (const Plan &p : plans) job.total += p.bytes;
              importThread(&plans, out, &job);
              std::printf("estado=%d copiado=%s de %s %s\n", (int)job.state, humanSize(job.done).c_str(), humanSize(job.total).c_str(), job.error.c_str());
              return job.state == 2 ? 0 : 1;
          }

          // ---------------------------------------------------------------------------------------------
          static int emuMain(int argc, char **argv)
          {
              std::setvbuf(stdout, nullptr, _IOLBF, 0);
              if (argc >= 4 && !std::strcmp(argv[1], "--import")) return cliImport(argv[2], argc - 3, argv + 3);
              std::printf("== re4_emu (CubeEvil4 para EmuELEC, etapa 2a: ventana + mando + menu) ==\n");
              loadCfg();

              if (SDL_Init(SDL_INIT_VIDEO | SDL_INIT_AUDIO | SDL_INIT_GAMECONTROLLER | SDL_INIT_JOYSTICK | SDL_INIT_TIMER) != 0) {
                  std::printf("ERROR: SDL_Init: %s\n", SDL_GetError());
                  return 2;
              }
              SDL_version cv, lv;
              SDL_VERSION(&cv);
              SDL_GetVersion(&lv);
              std::printf("SDL compilado %d.%d.%d, en uso %d.%d.%d, driver de video: %s\n", cv.major, cv.minor, cv.patch,
                          lv.major, lv.minor, lv.patch, SDL_GetCurrentVideoDriver() ? SDL_GetCurrentVideoDriver() : "?");

              const bool windowed = std::getenv("RE4_EMU_WINDOWED") != nullptr;
              SDL_DisplayMode dm;
              int dw = 1280, dh = 720;
              if (SDL_GetDesktopDisplayMode(0, &dm) == 0) { dw = dm.w; dh = dm.h; }
              std::printf("pantalla: %dx%d\n", dw, dh);

              SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_ES);
              SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, 3);
              SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, 0);
              Uint32 flags = SDL_WINDOW_OPENGL | SDL_WINDOW_SHOWN | (windowed ? 0 : SDL_WINDOW_FULLSCREEN);
              int ww = windowed ? 1280 : dw, wh = windowed ? 720 : dh;
              SDL_Window *win = SDL_CreateWindow("CubeEvil4", SDL_WINDOWPOS_UNDEFINED, SDL_WINDOWPOS_UNDEFINED, ww, wh, flags);
              if (!win) { std::printf("ERROR: SDL_CreateWindow: %s\n", SDL_GetError()); SDL_Quit(); return 3; }
              SDL_GLContext ctx = SDL_GL_CreateContext(win);
              if (!ctx) {
                  std::printf("AVISO: contexto GLES 3.0 no disponible (%s); pruebo GLES 2.0\n", SDL_GetError());
                  SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, 2);
                  SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, 0);
                  ctx = SDL_GL_CreateContext(win);
              }
              if (!ctx) { std::printf("ERROR: SDL_GL_CreateContext: %s\n", SDL_GetError()); SDL_DestroyWindow(win); SDL_Quit(); return 4; }
              SDL_GL_SetSwapInterval(1);
              int gw = ww, gh = wh;
              SDL_GL_GetDrawableSize(win, &gw, &gh);
              auto gs = [](GLenum e) { const unsigned char *s = glGetString(e); return s ? (const char *)s : "?"; };
              std::printf("GL: vendedor='%s' dibujo='%s' version='%s' glsl='%s'\n", gs(GL_VENDOR), gs(GL_RENDERER), gs(GL_VERSION),
                          gs(GL_SHADING_LANGUAGE_VERSION));
              std::printf("ventana: %dx%d (area de dibujo %dx%d)\n", ww, wh, gw, gh);
              if (!initDraw()) { std::printf("ERROR: no pude preparar el dibujo 2D\n"); return 6; }

              std::printf("mandos detectados por SDL: %d\n", SDL_NumJoysticks());
              for (int i = 0; i < SDL_NumJoysticks(); i++) openPad(i);

              // viewport 16:9 centrado (barras negras si la pantalla no es 16:9)
              float sc = std::min(gw / kCanvasW, gh / kCanvasH);
              int vw = (int)(kCanvasW * sc), vh = (int)(kCanvasH * sc);
              int vx = (gw - vw) / 2, vy = (gh - vh) / 2;

              const int testSeconds = std::getenv("RE4_EMU_TEST_SECONDS") ? std::atoi(std::getenv("RE4_EMU_TEST_SECONDS")) : 0;
              const char *shotPath = std::getenv("RE4_EMU_SHOT");
              const int shotFrame = std::getenv("RE4_EMU_SHOT_FRAME") ? std::atoi(std::getenv("RE4_EMU_SHOT_FRAME")) : 45;
              const bool autoMenu = std::getenv("RE4_EMU_AUTOMENU") != nullptr;

              // --- estado de la importacion de discos
              enum Screen { SC_STATUS, SC_CONFIRM, SC_IMPORT, SC_LOADING, SC_GAME };
              int screen = SC_STATUS;
              std::vector<Plan> plans;
              std::vector<std::string> importMsgs;
              ImportJob job;
              std::thread importTh;
              bool imported = fileExists("data/import.ok") || (fileExists("data/disc0/sys/boot.bin") && fileExists("data/disc1/sys/boot.bin"));
              std::string importInfo;
              uint64_t freeBytes = 0, needBytes = 0;
              double importStart = 0;
              {
                  struct statvfs sv;
                  if (statvfs(".", &sv) == 0) freeBytes = (uint64_t)sv.f_bavail * sv.f_frsize;
                  if (imported) {
                      FILE *mf = std::fopen("data/import.ok", "r");
                      char ln[200];
                      if (mf && std::fgets(ln, sizeof(ln), mf)) {
                          const char *sp = std::strchr(ln, ' ');
                          if (sp) importInfo = std::string(sp + 1, std::min<size_t>(6, std::strlen(sp + 1)));
                      }
                      if (mf) std::fclose(mf);
                      if (importInfo.empty()) {
                          FILE *bf = std::fopen("data/disc0/sys/boot.bin", "rb");
                          char id[7] = {0};
                          if (bf && std::fread(id, 1, 6, bf) == 6) importInfo = id;
                          if (bf) std::fclose(bf);
                      }
                      std::printf("discos ya importados en data/ (%s)\n", importInfo.c_str());
                  } else {
                      scanAssets(plans, importMsgs);
                      for (const std::string &m : importMsgs) std::printf("[discos] %s\n", m.c_str());
                      if (plans.size() == 2) {
                          for (const Plan &pl : plans) needBytes += pl.bytes;
                          std::printf("[discos] listos para importar: %s + %s (%s), hacen falta %s, libres %s\n", plans[0].disc.file.c_str(),
                                      plans[1].disc.file.c_str(), plans[0].disc.id.c_str(), humanSize(needBytes).c_str(), humanSize(freeBytes).c_str());
                          screen = SC_CONFIRM;
                      }
                  }
              }

              bool startRequested = imported && std::getenv("RE4_EMU_AUTOSTART") != nullptr;
              int startStage = 0;
              bool gameRan = false, gameDead = false, menuPaused = false, selDebugFired = false;
              double lastStatLog = 0;
              bool prev[B_COUNT] = {false}, cur[B_COUNT] = {false};
              bool menuOpen = false, quit = false;
              int sel = 0;
              Uint64 t0 = SDL_GetPerformanceCounter(), freq = SDL_GetPerformanceFrequency();
              double lastSelDown = -1, comboStart = -1, repeatAt = 0;
              bool selCombo = false, selLongShown = false;
              std::string lastBtn = "(ninguno)";
              int frames = 0, fpsFrames = 0;
              double fpsT = 0, fpsVal = 0;
              // medicion (cada 5 s en la linea [gx]): ms medios por vuelta de cada fase y cuadros del juego por vuelta
              auto pcMs = []() { return (double)SDL_GetPerformanceCounter() * 1000.0 / (double)SDL_GetPerformanceFrequency(); };
              double tRun = 0, tDraw = 0, tSwap = 0;
              unsigned nIter = 0, nChunks = 0;

              while (!quit) {
                  double now = (double)(SDL_GetPerformanceCounter() - t0) / (double)freq;
                  SDL_Event e;
                  while (SDL_PollEvent(&e)) {
                      if (e.type == SDL_QUIT) quit = true;
                      else if (e.type == SDL_CONTROLLERDEVICEADDED) openPad(e.cdevice.which);
                      else if (e.type == SDL_CONTROLLERDEVICEREMOVED) closePad(e.cdevice.which);
                      else if (e.type == SDL_CONTROLLERBUTTONDOWN) {
                          const char *n = SDL_GameControllerGetStringForButton((SDL_GameControllerButton)e.cbutton.button);
                          lastBtn = n ? n : "?";
                          if (gEventLog++ < 300) std::printf("[mando] boton %s (t=%.1fs)\n", lastBtn.c_str(), now);
                      } else if (e.type == SDL_CONTROLLERBUTTONUP) {
                          if (gEventLog < 300) std::printf("[mando] suelta %s\n", SDL_GameControllerGetStringForButton((SDL_GameControllerButton)e.cbutton.button));
                      }
                  }
                  readInput(cur);
                  auto edge = [&](Btn b) { return cur[b] && !prev[b]; };

                  if (screen == SC_CONFIRM) {
                      if (edge(B_A)) {
                          if (freeBytes < needBytes + (100ull << 20)) {
                              importMsgs.push_back("No hay espacio suficiente: faltan " + humanSize(needBytes + (100ull << 20) - freeBytes));
                              screen = SC_STATUS;
                          } else {
                              job.total = needBytes;
                              importStart = now;
                              importTh = std::thread(importThread, &plans, std::string("data"), &job);
                              screen = SC_IMPORT;
                              std::printf("[importar] empieza\n");
                          }
                      }
                      if (edge(B_B)) { screen = SC_STATUS; std::printf("[importar] omitido por el usuario\n"); }
                  } else if (screen == SC_IMPORT) {
                      if (edge(B_B)) job.cancel = true;
                      if (job.state >= 2) {
                          importTh.join();
                          if (job.state == 2) {
                              imported = true;
                              importInfo = plans[0].disc.id;
                              std::printf("[importar] terminado (%.0f s)\n", now - importStart);
                          } else {
                              importMsgs.push_back(job.state == 4 ? "Importación cancelada" : "Error al importar: " + job.error);
                              std::printf("[importar] %s\n", importMsgs.back().c_str());
                          }
                          screen = SC_STATUS;
                      }
                  }

                  // --- arrancar el juego (START en la pantalla de estado, o solo si el lanzador lo pide)
                  if (screen == SC_STATUS && imported && !gameDead && (startRequested || (edge(B_START) && !cur[B_SELECT] && !cur[B_GUIDE]))) {
                      startRequested = false;
                      screen = SC_LOADING;
                      startStage = 0;
                  } else if (screen == SC_LOADING) {
                      if (startStage == 0) startStage = 1;  // primero se dibuja un cuadro con el aviso, luego se bloquea cargando
                      else {
                          std::string err;
                          bool ok = startGame(err) && initGx(err);
                          if (!ok) {
                              importMsgs.push_back("No pude iniciar el juego: " + err);
                              std::printf("[juego] ERROR: %s\n", err.c_str());
                              gameDead = true;
                              screen = SC_STATUS;
                          } else {
                              screen = SC_GAME;
                              gameRan = true;
                              std::printf("[juego] en pantalla\n");
                          }
                      }
                  }

                  // --- salir: SELECT (o GUIA) + START mantenidos 1,5 s
                  bool combo = (cur[B_SELECT] || cur[B_GUIDE]) && cur[B_START];
                  if (combo) {
                      if (comboStart < 0) comboStart = now;
                      if (now - comboStart >= 1.5) quit = true;
                  } else comboStart = -1;

                  // --- SELECT: pulsar = menu, mantener = menu de depuracion del juego (aun no conectado)
                  if (edge(B_SELECT)) { lastSelDown = now; selCombo = false; selLongShown = false; selDebugFired = false; }
                  if (cur[B_SELECT] && cur[B_START]) selCombo = true;
                  if (cur[B_SELECT] && lastSelDown >= 0 && now - lastSelDown >= 1.0 && !selCombo) selLongShown = true;
                  if (!cur[B_SELECT] && prev[B_SELECT] && !selCombo && (screen == SC_STATUS || screen == SC_GAME)) {
                      if (now - lastSelDown < 1.0) { menuOpen = !menuOpen; if (menuOpen) sel = 0; if (!menuOpen) saveCfg(); }
                  }
                  if (screen == SC_GAME && selLongShown && !selDebugFired && !menuOpen) {
                      selDebugFired = true;
                      std::printf("[juego] SELECT mantenido: menu de depuracion del juego\n");
                      if (gApi.debugMenu) gApi.debugMenu();
                  }
                  if (edge(B_R3) && (screen == SC_STATUS || screen == SC_GAME)) { menuOpen = !menuOpen; if (menuOpen) sel = 0; if (!menuOpen) saveCfg(); }
                  if (autoMenu && frames == 10 && screen == SC_STATUS) menuOpen = true;
                  if (screen == SC_GAME && menuOpen != menuPaused) {  // el juego se detiene con el menu abierto
                      if (gApi.pause) gApi.pause(menuOpen ? 1 : 0, menuOpen ? 300 : 0);
                      menuPaused = menuOpen;
                      if (!menuOpen) applyCore();
                  }

                  // --- navegacion del menu (con repeticion al mantener izquierda/derecha/arriba/abajo)
                  if (menuOpen) {
                      bool rep = false;
                      for (Btn b : {B_UP, B_DOWN, B_LEFT, B_RIGHT})
                          if (cur[b] && !prev[b]) repeatAt = now + 0.4;
                      if ((cur[B_UP] || cur[B_DOWN] || cur[B_LEFT] || cur[B_RIGHT]) && now >= repeatAt && repeatAt > 0) {
                          rep = true;
                          repeatAt = now + 0.12;
                      }
                      if (edge(B_UP) || (rep && cur[B_UP])) sel = (sel + IT_COUNT - 1) % IT_COUNT;
                      if (edge(B_DOWN) || (rep && cur[B_DOWN])) sel = (sel + 1) % IT_COUNT;
                      if (edge(B_LEFT) || (rep && cur[B_LEFT])) changeItem(sel, -1);
                      if (edge(B_RIGHT) || (rep && cur[B_RIGHT])) changeItem(sel, +1);
                      if (edge(B_A)) {
                          if (sel == IT_SAVE) { menuOpen = false; saveCfg(); }
                          else if (sel == IT_QUIT) { saveCfg(); quit = true; }
                          else changeItem(sel, +1);
                      }
                      if (edge(B_B)) { menuOpen = false; saveCfg(); }
                  }
                  for (int i = 0; i < B_COUNT; i++) prev[i] = cur[i];

                  // --- fin automatico de prueba
                  if (testSeconds > 0 && now >= testSeconds) { std::printf("fin automatico (%d s)\n", testSeconds); quit = true; }

                  // --- el juego: mando -> nucleo, imagenes del nucleo -> renderizador
                  bool pictureShown = false;
                  if (screen == SC_GAME) {
                      Re4CorePad pd = makePad(menuOpen, cur[B_SELECT] || cur[B_GUIDE]);
                      gApi.pad(&pd);
                      int ran = 0;
                      const double pcRun0 = pcMs();
                      // como mucho ~12 ms de cuadros por vuelta: se dibuja y se muestra seguido en vez de
                      // vaciar hasta 64 cuadros de golpe (eso congelaba la imagen ~2,5 s con el juego corriendo)
                      const Uint32 runStart = SDL_GetTicks();
                      while (ran < 64) {
                          const Re4GxChunk *c = gApi.gxAcquire();
                          if (!c) break;
                          gGx->Run(*c);
                          gApi.gxRelease(c);
                          ran++;
                          if (SDL_GetTicks() - runStart >= 12) break;
                      }
                      tRun += pcMs() - pcRun0;
                      nChunks += (unsigned)ran;
                      nIter++;
                      if (!ran) gGx->Prewarm(2.0);
                      int st = gApi.state();
                      if (st == RE4_CORE_FAILED || st == RE4_CORE_ENDED) {
                          const char *m = gApi.message ? gApi.message() : nullptr;
                          importMsgs.push_back(std::string("El juego se detuvo: ") + (m ? m : "sin detalle"));
                          std::printf("[juego] el nucleo se detuvo (estado %d): %s\n", st, m ? m : "-");
                          gameDead = true;
                          screen = SC_STATUS;
                      }
                      if (now - lastStatLog >= 5.0 && gGx) {
                          lastStatLog = now;
                          const re4gx::GxStats &g = gGx->Stats();
                          std::printf("[gx] t=%.0fs fps=%.0f chunks=%u draws=%u triangulos=%u programas=%u (de cache %u) texturas=%u errores_shader=%u sin_textura=%u estado_nucleo=%d\n",
                                      now, fpsVal, g.chunks, g.draws, g.triangles, g.programs, g.programsLoaded, g.textures, g.shaderErrors, g.missingTextures, st);
                          if (nIter) {
                              std::printf("[gx] medicion: %u vueltas, %.2f cuadros/vuelta, por vuelta: Run %.1f ms, dibujo %.1f ms, swap %.1f ms\n",
                                          nIter, (double)nChunks / nIter, tRun / nIter, tDraw / nIter, tSwap / nIter);
                          }
                          tRun = tDraw = tSwap = 0;
                          nIter = nChunks = 0;
                      }
                  }

                  // --- dibujo
                  glBindFramebuffer(GL_FRAMEBUFFER, 0);
                  glDisable(GL_SCISSOR_TEST);
                  glColorMask(GL_TRUE, GL_TRUE, GL_TRUE, GL_TRUE);
                  glViewport(0, 0, gw, gh);
                  glClearColor(0, 0, 0, 1);
                  glClear(GL_COLOR_BUFFER_BIT);
                  if (screen == SC_GAME) {
                      const double pcD0 = pcMs();
                      pictureShown = drawPicture(gw, gh);
                      tDraw += pcMs() - pcD0;
                  }
                  glViewport(vx, vy, vw, vh);
                  const bool inGame = (screen == SC_GAME);
                  if (!inGame) {
                      rect(0, 0, kCanvasW, kCanvasH, {12, 16, 30, 255});
                      rect(0, 0, kCanvasW, 36, {150, 20, 20, 255});
                      text("CubeEvil4 para EmuELEC", 12, 6, 2, {255, 255, 255, 255});
                  }

                  char line[200];
                  float y = 50;
                  auto put = [&](const std::string &s, Col c = {220, 225, 235, 255}) {
                      const size_t W = 76;  // ancho de la pantalla en letras: los textos largos pasan a la linea siguiente
                      size_t pos = 0;
                      do {
                          size_t end = std::min(s.size(), pos + W);
                          while (end < s.size() && (s[end] & 0xC0) == 0x80) end--;  // no cortar una letra UTF-8 por la mitad
                          text(s.substr(pos, end - pos), 14, y, 1, c);
                          y += 18;
                          pos = end;
                      } while (pos < s.size());
                  };
                  auto bar = [&](float x, float by, float w, float frac) {
                      rect(x, by, w, 22, {0, 0, 0, 255});
                      rect(x + 3, by + 3, (w - 6) * std::min(1.0f, std::max(0.0f, frac)), 16, {80, 200, 120, 255});
                  };
                  if (inGame) {
                      if (!pictureShown) text("Esperando la primera imagen del juego...", 150, 170, 1, {255, 255, 255, 255});
                  } else if (screen == SC_LOADING) {
                      put("Iniciando el juego...", {255, 210, 90, 255});
                      put("La primera vez tarda: carga el núcleo y prepara los gráficos.");
                      put("Si no pasa de aquí, mira launcher.txt.");
                  } else if (screen == SC_CONFIRM) {
                      put("Importar los discos del juego", {255, 210, 90, 255});
                      y += 6;
                      for (const Plan &pl : plans)
                          put("Disco " + std::to_string(pl.disc.number + 1) + ": " + pl.disc.file + "  (" + pl.disc.id + ", " + humanSize(pl.disc.size) + ")");
                      put(std::string("Edición: ") + releaseName(plans[0].disc.id), {140, 220, 160, 255});
                      y += 6;
                      put("Se copiarán sus archivos a la carpeta data/ del port:");
                      put("  hacen falta " + humanSize(needBytes) + ", libres " + humanSize(freeBytes), freeBytes < needBytes ? Col{240, 150, 150, 255} : Col{220, 225, 235, 255});
                      put("  (tarda unos minutos; solo se hace una vez)");
                      for (const std::string &m : importMsgs) put(m, {240, 150, 150, 255});
                      text("A: importar ahora    B: omitir por ahora    SELECT+START (1,5 s): salir", 12, 326, 1, {170, 180, 200, 255});
                  } else if (screen == SC_IMPORT) {
                      double done = (double)job.done, total = (double)std::max<uint64_t>(1, job.total);
                      double el = std::max(0.1, now - importStart);
                      put("Importando disco " + std::to_string((int)job.discNo) + " de 2", {255, 210, 90, 255});
                      y += 6;
                      std::string cur2 = job.cur;
                      if (cur2.size() > 70) cur2 = "..." + cur2.substr(cur2.size() - 67);
                      put("Archivo: " + cur2);
                      std::snprintf(line, sizeof(line), "%.0f%%   %s de %s   %.1f MB/s", 100.0 * done / total, humanSize((uint64_t)done).c_str(),
                                    humanSize((uint64_t)total).c_str(), done / 1048576.0 / el);
                      put(line);
                      bar(14, y + 6, kCanvasW - 28, (float)(done / total));
                      y += 36;
                      put("Archivos copiados: " + std::to_string((int)job.filesDone));
                      text("B: cancelar    SELECT+START (1,5 s): salir", 12, 326, 1, {170, 180, 200, 255});
                  } else {
                  put("Etapa 2c: importación de discos, juego y mando", {255, 210, 90, 255});
                  std::snprintf(line, sizeof(line), "Video: %s %dx%d   GL: %s", SDL_GetCurrentVideoDriver() ? SDL_GetCurrentVideoDriver() : "?", gw, gh, gs(GL_VERSION));
                  put(line);
                  put(std::string("Dibujo: ") + gs(GL_RENDERER));
                  std::snprintf(line, sizeof(line), "Mandos conectados: %d", (int)gPads.size());
                  put(line);
                  for (const Pad &p : gPads) put("  - " + p.name, {140, 220, 160, 255});
                  if (gPads.empty()) put("  (ninguno: conecta un mando; teclado: flechas/Intro/Tab)", {240, 150, 150, 255});
                  put("Último botón: " + lastBtn);
                  std::snprintf(line, sizeof(line), "Ahora pulsado:%s%s%s%s%s%s%s%s", cur[B_A] ? " A" : "", cur[B_B] ? " B" : "",
                                cur[B_X] ? " X" : "", cur[B_Y] ? " Y" : "", cur[B_START] ? " START" : "", cur[B_SELECT] ? " SELECT" : "",
                                cur[B_L3] ? " L3" : "", cur[B_R3] ? " R3" : "");
                  put(line);
                  if (selLongShown) put("SELECT mantenido: aquí se abriría el menú de depuración del juego (solo discos debug)", {255, 210, 90, 255});
                  // barra que se mueve: ayuda a ver fluidez y tirones
                  float bx = (float)((std::sin(now * 2.5) + 1.0) * 0.5 * (kCanvasW - 60));
                  rect(0, 292, kCanvasW, 22, {25, 30, 50, 255});
                  rect(bx, 294, 60, 18, {80, 200, 120, 255});
                  if (imported) put("Discos importados en data/: " + importInfo + " (" + releaseName(importInfo) + ")", {140, 220, 160, 255});
                  if (imported && !gameDead) put("START: jugar", {255, 210, 90, 255});
                  for (const std::string &m : importMsgs) put(m, {240, 150, 150, 255});
                  text("START: jugar   SELECT/R3: menú   SELECT+START (1,5 s): salir", 12, 326, 1, {170, 180, 200, 255});
                  }

                  if (gCfg.fps) {
                      std::snprintf(line, sizeof(line), "%.0f FPS", fpsVal);
                      text(line, kCanvasW - 8 * (float)std::strlen(line) - 8, inGame ? 6 : 44, 1, {255, 255, 120, 255});
                  }
                  if (comboStart >= 0) {
                      float p = (float)std::min(1.0, (now - comboStart) / 1.5);
                      rect(170, 250, 300, 22, {0, 0, 0, 220});
                      rect(174, 254, 292 * p, 14, {230, 70, 70, 255});
                      text("Saliendo...", 270, 232, 1, {255, 255, 255, 255});
                  }

                  if (menuOpen) {
                      rect(0, 0, kCanvasW, kCanvasH, {0, 0, 0, 170});
                      float px = 90, py = 40, pw = 460, ph = 280;
                      rect(px, py, pw, ph, {20, 24, 42, 245});
                      rect(px, py, pw, 28, {150, 20, 20, 255});
                      text("Menú de CubeEvil4", px + 12, py + 6, 1, {255, 255, 255, 255});
                      for (int i = 0; i < IT_COUNT; i++) {
                          float iy = py + 40 + i * 22;
                          if (i == sel) rect(px + 8, iy - 3, pw - 16, 22, {70, 90, 160, 255});
                          Col c = (i == IT_CHEATS) ? Col{140, 140, 150, 255} : Col{235, 238, 245, 255};
                          text(itemLabel(i), px + 18, iy, 1, c);
                      }
                      text("Arr/Abj: elegir  Izq/Der: cambiar  A: ok  B: cerrar", px + 8, py + ph - 22, 1, {170, 180, 200, 255});
                  }
                  flush();

                  frames++;
                  fpsFrames++;
                  if (now - fpsT >= 1.0) { fpsVal = fpsFrames / (now - fpsT); fpsFrames = 0; fpsT = now; }

                  if (shotPath && frames == shotFrame) {
                      std::vector<unsigned char> px((size_t)gw * gh * 4), flip((size_t)gw * gh * 4);
                      glPixelStorei(GL_PACK_ALIGNMENT, 1);
                      glReadPixels(0, 0, gw, gh, GL_RGBA, GL_UNSIGNED_BYTE, px.data());
                      for (int yy = 0; yy < gh; yy++) std::memcpy(&flip[(size_t)yy * gw * 4], &px[(size_t)(gh - 1 - yy) * gw * 4], (size_t)gw * 4);
                      SDL_Surface *s = SDL_CreateRGBSurfaceFrom(flip.data(), gw, gh, 32, gw * 4, 0x000000FF, 0x0000FF00, 0x00FF0000, 0xFF000000);
                      if (s) { SDL_SaveBMP(s, shotPath); SDL_FreeSurface(s); std::printf("captura guardada: %s\n", shotPath); }
                  }
                  const double pcS0 = pcMs();
                  SDL_GL_SwapWindow(win);
                  tSwap += pcMs() - pcS0;
                  if (screen == SC_GAME && gApi.vsync) {
                      struct timespec ts;
                      clock_gettime(CLOCK_MONOTONIC, &ts);
                      gApi.vsync((int64_t)ts.tv_sec * 1000000000LL + ts.tv_nsec);
                  }
              }

              if (gameRan) {  // el juego no se cierra con calma: se guarda lo propio y se sale
                  saveCfg();
                  std::printf("fin (juego)\n");
                  std::fflush(stdout);
                  _exit(0);
              }

              if (importTh.joinable()) { job.cancel = true; importTh.join(); }
              saveCfg();
              for (const Pad &p : gPads) SDL_GameControllerClose(p.gc);
              SDL_GL_DeleteContext(ctx);
              SDL_DestroyWindow(win);
              SDL_Quit();
              std::printf("fin\n");
              return 0;
          }

          static void crashHandler(int sig)
          {
              void *bt[40];
              int n = backtrace(bt, 40);
              const char msg[] = "\n[crash] senal ";
              if (write(2, msg, sizeof(msg) - 1) < 0) {}
              char num[16];
              int len = std::snprintf(num, sizeof(num), "%d\n", sig);
              if (write(2, num, (size_t)len) < 0) {}
              backtrace_symbols_fd(bt, n, 2);
              _exit(128 + sig);
          }

          // el lanzador (copia de loader.c de re4_host) reserva la memoria del juego y llama aqui
          extern "C" __attribute__((visibility("default"))) int re4_host_main(int argc, char **argv)
          {
              signal(SIGSEGV, crashHandler);
              signal(SIGBUS, crashHandler);
              signal(SIGILL, crashHandler);
              signal(SIGFPE, crashHandler);
              signal(SIGABRT, crashHandler);
              return emuMain(argc, argv);
          }

          #ifdef RE4_EMU_STANDALONE
          int main(int argc, char **argv) { return re4_host_main(argc, argv); }
          #endif
          RE4_EMU_SRC_END
          SRC=port/android-decomp/app/src/main/cpp
          /opt/wrap/clang++ --target=aarch64-linux-gnu -std=c++17 -O2 -fPIC -shared -w \
            -Iemu -Iemu/shim -Iemu/glhdr -isystem /opt/sdl2dev/usr/include/SDL2 -isystem /opt/sdl2dev/usr/include \
            -I$SRC -Iport/whole/runtime \
            emu/re4_emu.cpp $SRC/gx_gl.cpp $SRC/gx_core.cpp $SRC/gx_renderer.cpp $SRC/gx_gl_shader.cpp \
            $SRC/gx_selfcheck.cpp $SRC/gx_texture.cpp \
            -o out/libre4_emu.so \
            /opt/sdl2dev/usr/lib/aarch64-linux-gnu/libSDL2-2.0.so.0 emu/stubs/libGLESv2.so.2
          file out/libre4_emu.so
          readelf -d out/libre4_emu.so | grep -E "NEEDED" || true
          echo "== simbolos sin resolver de libre4_emu.so (deben ser solo gl*, SDL_* y re4_*) =="
          readelf -Ws --dyn-syms out/libre4_emu.so | awk '$7 == "UND" && $8 != "" {print $8}' | sed 's/@.*//' | grep -v -E '^(gl|SDL_)' | sort -u | head -80
          # el lanzador: copia de loader.c de re4_host que carga libre4_emu.so en vez de libre4_host.so
          sed 's/libre4_host\.so/libre4_emu.so/g' port/whole/host/loader.c > emu/loader_emu.c
          grep -c "libre4_emu.so" emu/loader_emu.c
          /opt/wrap/clang --target=aarch64-linux-gnu -O2 -Iport/whole/host -Iport/whole/runtime emu/loader_emu.c -o out/re4_emu
          file out/re4_emu
          readelf -d out/re4_emu | grep -E "NEEDED" || true

      - name: Cache del compilador (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configurar
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1500M
        run: |
          set -o pipefail
          cmake -S port/whole -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/emuelec-aarch64.cmake" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRE4_OPT_LEVEL=2 2>&1 | tee configure.log

      - name: Compilar
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1500M
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log
          ccache -s | head -12

      - name: Reunir resultado
        run: |
          # re4_host busca los modulos del juego en <carpeta de re4_host>/modules
          mkdir -p out/modules
          find build -maxdepth 1 -type f \( -name 'libre4_*.so*' -o -name 're4_host' \) -exec cp -v {} out/ \;
          find build/modules -type f -name 'libre4_*.so' -exec cp -v {} out/modules/ \;
          # (no se llevan libstdc++ ni libgcc_s: se usan las de la caja, GLIBCXX <= 3.4.25)
          cat > out/probar.sh <<'EOF'
          #!/bin/bash
          # Prueba en la caja: carga el nucleo y los modulos (no necesita discos).
          # Copia esta carpeta a la caja y ejecuta este script (por SSH o desde Ports).
          cd "$(dirname "$0")" || exit 1
          chmod +x re4_host probar.sh 2>/dev/null
          export LD_LIBRARY_PATH="$PWD:$LD_LIBRARY_PATH"
          {
            echo "== fecha: $(date)"; uname -a; free -m | head -2
            echo "== self-test ==";      ./re4_host --self-test;      echo "codigo: $?"
            echo "== runtime-test ==";   ./re4_host --runtime-test;   echo "codigo: $?"
            echo "== check-modules =="; ./re4_host --check-modules;  echo "codigo: $?"
          } 2>&1 | tee probar.log
          EOF
          chmod +x out/probar.sh
          find out -type f | sort | head -300
          du -sh out

      - name: Comprobar versiones de glibc y libstdc++
        run: |
          cd out
          echo "== GLIBC maximo pedido (la caja tiene 2.29) =="
          find . -type f \( -name '*.so*' -o -name re4_host -o -name re4_emu \) | while read -r f; do
            readelf -Ws --dyn-syms "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*'; done | sort -uV | tail -3
          echo "== GLIBCXX maximo pedido (la caja llega a 3.4.25) =="
          find . -type f \( -name '*.so*' -o -name re4_host -o -name re4_emu \) | while read -r f; do
            readelf -Ws --dyn-syms "$f" 2>/dev/null | grep -o 'GLIBCXX_[0-9.]*'; done | sort -uV | tail -3
          echo "== librerias que pide el nucleo =="
          readelf -d libre4_main.so re4_host libre4_host.so libre4_emu.so re4_emu 2>/dev/null | grep -E "NEEDED|RUNPATH|RPATH|File:" || true

      - uses: actions/upload-artifact@v4
        with:
          name: emuelec-core-aarch64
          path: out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore
